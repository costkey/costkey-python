[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "costkey"
version = "0.7.4"
description = "AI cost observability: captures raw telemetry from AI provider calls and agent frameworks; CostKey's server does the pricing and analysis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "CostKey", email = "hello@costkey.dev" }]
keywords = ["ai", "llm", "cost", "tracking", "observability", "openai", "anthropic", "gemini", "agents", "prompts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
# Framework integrations (costkey.integrations.*). Each is imported lazily;
# `import costkey` never imports a framework.
openai-agents = ["openai-agents>=0.22"]
langchain = ["langchain-core>=1.0"]
langgraph = ["langchain-core>=1.0", "langgraph>=1.0"]
crewai = ["crewai>=1.15"]
llama-index = ["llama-index-core>=0.14"]
pydantic-ai = ["pydantic-ai-slim>=2.55"]
google-adk = ["google-adk>=2.11"]
claude-agent-sdk = ["claude-agent-sdk>=0.2.165"]
smolagents = ["smolagents>=1.26"]
autogen = ["autogen-agentchat>=0.7.5", "opentelemetry-sdk>=1.30"]
ag2 = ["ag2>=1.1"]
dspy = ["dspy>=3.4"]
strands = ["strands-agents>=1.59"]
opentelemetry = ["opentelemetry-sdk>=1.30"]
test = ["pytest", "aiohttp", "botocore", "requests"]

[project.scripts]
costkey = "costkey.cli:main"

[project.urls]
Homepage = "https://costkey.dev"
Repository = "https://github.com/costkey/costkey-python"
Documentation = "https://github.com/costkey/costkey-python"
Issues = "https://github.com/costkey/costkey-python/issues"
Changelog = "https://github.com/costkey/costkey-python/releases"

[tool.hatch.build.targets.wheel]
packages = ["costkey"]

[tool.hatch.build.targets.sdist]
# The source archive is a distributable package boundary, not a checkout
# snapshot. Keep tests, local benchmarks, CI metadata, caches, and artifacts
# out of it (the wheel already contains only the package).
include = ["costkey", "README.md", "pyproject.toml"]
exclude = ["tests", "scripts", ".github", "dist", ".venv*", ".DS_Store", "**/.DS_Store", ".pytest_cache", ".conductor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
