[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "costkey"
version = "0.6.0"
description = "AI cost observability for supported provider calls: cost, tokens, latency, prompts, and tool metadata without an extra provider-routing hop."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "CostKey", email = "hello@costkey.dev" }]
keywords = ["ai", "llm", "cost", "tracking", "observability", "openai", "anthropic", "gemini", "agents", "prompts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
test = ["pytest", "aiohttp", "botocore", "requests"]

[project.scripts]
costkey = "costkey.cli:main"

[project.urls]
Homepage = "https://costkey.dev"
Repository = "https://github.com/costkey/costkey-python"
Documentation = "https://github.com/costkey/costkey-python"
Issues = "https://github.com/costkey/costkey-python/issues"
Changelog = "https://github.com/costkey/costkey-python/releases"

[tool.hatch.build.targets.wheel]
packages = ["costkey"]

[tool.hatch.build.targets.sdist]
# The source archive is a distributable package boundary, not a checkout
# snapshot. Keep tests, local benchmarks, CI metadata, caches, and artifacts
# out of it (the wheel already contains only the package).
include = ["costkey", "README.md", "pyproject.toml"]
exclude = ["tests", "scripts", ".github", "dist", ".venv*", ".DS_Store", "**/.DS_Store", ".pytest_cache", ".conductor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
